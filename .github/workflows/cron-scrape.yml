name: Rojgar Scraper Cron

on:
  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"

  # Allows manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Cron API
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            ${{ secrets.CRON_URL }}
